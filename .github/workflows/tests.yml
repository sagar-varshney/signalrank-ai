name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[test]'
      - run: python -m unittest discover -s tests -v
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Verify wheel assets and package boundary
        run: >-
          python -c "from pathlib import Path; from zipfile import ZipFile;
          names = ZipFile(next(Path('dist').glob('signalrank_ai-*.whl'))).namelist();
          required = {'signalrank/diagnostics.py', 'signalrank/benchmark.py', 'signalrank/inference.py', 'signalrank/uncertainty.py', 'signalrank/reliability.py', 'signalrank/reporting.py', 'signalrank/demo.py', 'signalrank/static/editorial.css', 'signalrank/static/theme.js', 'signalrank/static/react/experiments.js', 'signalrank/static/react/experiments.css', 'signalrank/static/react/THIRD-PARTY-NOTICES.txt'};
          assert required.issubset(names), 'Missing ML modules or compiled UI assets';
          assert all(n.startswith(('signalrank/', 'signalrank_ai-')) for n in names), 'Unexpected package contents'"
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: git diff --exit-code -- ../signalrank/static/react
