name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.12.23
      - run: uv sync --locked --extra test --python 3.13
      - run: .venv/bin/python -m unittest discover -s tests -v
      - run: uv build --wheel
      - name: Verify wheel assets and package boundary
        run: >-
          python -c "from pathlib import Path; from zipfile import ZipFile;
          names = ZipFile(next(Path('dist').glob('signalrank_ai-*.whl'))).namelist();
          required = {'signalrank/diagnostics.py', 'signalrank/benchmark.py', 'signalrank/inference.py', 'signalrank/uncertainty.py', 'signalrank/reliability.py', 'signalrank/reporting.py', 'signalrank/replay.py', 'signalrank/challenge.py', 'signalrank/verify.py', 'signalrank/demo.py', 'signalrank/static/editorial.css', 'signalrank/static/theme.js', 'signalrank/static/react/experiments.js', 'signalrank/static/react/experiments.css', 'signalrank/static/react/THIRD-PARTY-NOTICES.txt'};
          assert required.issubset(names), 'Missing ML modules or compiled UI assets';
          assert all(n.startswith(('signalrank/', 'signalrank_ai-')) for n in names), 'Unexpected package contents'"
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: git diff --exit-code -- ../signalrank/static/react
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.12.23
      - run: uv sync --locked --extra test --python 3.13
      - name: Verify clean-install training and saved-model reload
        run: .venv/bin/python -m signalrank.verify
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: pnpm test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-failure-evidence
          path: frontend/test-results/
          retention-days: 7
