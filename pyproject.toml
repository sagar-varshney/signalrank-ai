[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "signalrank-ai"
version = "0.1.0"
description = "Reproducible rare-event forecasting with an auditable data boundary"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "scikit-learn>=1.5,<2", "numpy>=2,<3", "joblib>=1.4,<2"]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[tool.setuptools]
packages = ["signalrank"]

[tool.setuptools.package-data]
signalrank = ["static/*.html", "static/*.css", "static/*.js", "static/react/*.js", "static/react/*.css", "static/react/*.txt", "*.json"]
